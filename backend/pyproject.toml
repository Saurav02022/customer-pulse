# Tool configuration only. The backend is not packaged.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import order
  "B",  # bugbear: likely bugs
  "UP", # modern Python syntax for the pinned version
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
